[workspace]
members = [
    "apps/host",
    "apps/desktop/src-tauri",
    "crates/core",
    "crates/contracts",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
muxyard-core = { path = "crates/core" }
muxyard-contracts = { path = "crates/contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
