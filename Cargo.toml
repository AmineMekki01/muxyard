[workspace]
members = [
    "apps/host",
    "apps/desktop/src-tauri",
    "crates/core",
    "crates/contracts",
    "crates/platform",
    "crates/storage",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
muxyard-core = { path = "crates/core" }
muxyard-contracts = { path = "crates/contracts" }
muxyard-platform = { path = "crates/platform" }
muxyard-storage = { path = "crates/storage" }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
uuid = { version = "1.29.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
